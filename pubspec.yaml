name: map_ady
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  google_sign_in: ^6.1.6
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  local_auth: ^2.2.0
  maplibre_gl: ^0.26.2
  location: ^7.0.1
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/avatar/
    - assets/skins/
    - assets/icons/
    - assets/icons/bottombar/
    - assets/images/
    - assets/sound/

  fonts:
    - family: Anybody
      fonts:
        - asset: assets/fonts/Anybody-Regular.ttf
        - asset: assets/fonts/Anybody-Bold.ttf
          weight: 700
        - asset: assets/fonts/Anybody-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_mapady.png"
  adaptive_icon_background: "#131318"
  adaptive_icon_foreground: "assets/images/logo_mapady.png"
